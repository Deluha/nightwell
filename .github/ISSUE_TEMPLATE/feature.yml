name: Feature request
description: Something Nightwell does not do yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Never attach a catalog snapshot or a report from a real project, and never paste a connection string or a key: issues are public.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stands in the way
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like Nightwell to do. Check ROADMAP.md first, including its list of what is not planned.
    validations:
      required: false
