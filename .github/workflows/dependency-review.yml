# Reviews dependency changes in a pull request: known vulnerabilities and the
# licence allow-list.
name: dependency-review

on:
  pull_request:

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Python-2.0, Unlicense
          # The fixture's Flutter package (owner, 2026-11-27): the registry reports its licence as "mit",
          # not an SPDX id; its LICENSE file is MIT.
          allow-dependencies-licenses: pkg:pub/supabase_flutter
