# The type-check and the offline suite with coverage, on three operating
# systems and every supported Node line.
name: ci-tests

on:
  workflow_call:

permissions: {}

jobs:
  tests:
    name: tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install from the lockfile, install scripts off
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Offline suite with coverage thresholds
        run: npm run test:coverage
