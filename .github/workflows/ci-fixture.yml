# Boots the demo fixture on PostgreSQL 17 and runs its live tests and the oracle,
# then boots it on PostgreSQL 15 and runs the manifest live test.
name: ci-fixture

on:
  workflow_call:

permissions: {}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install from the lockfile, install scripts off
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start the fixture on PostgreSQL 17
        run: npm run fixture:start
      - name: Pins, manifest and oracle live tests on PostgreSQL 17
        run: NIGHTWELL_LIVE=1 npx vitest run tests/fixture
      - name: Stop the fixture
        run: npm run fixture:stop
      - name: Start the fixture on PostgreSQL 15
        run: npm run fixture:start -- --pg 15
      - name: Manifest live test on PostgreSQL 15
        run: NIGHTWELL_LIVE=1 npx vitest run tests/fixture/manifest.live.test.ts
      - name: Stop the fixture
        if: always()
        run: npm run fixture:stop
