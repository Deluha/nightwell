# The planted-feature manifest of the Cellarbook fixture: one entry per `planted:` marker under fixture/.
# The oracle (tests/fixture/oracle.live.test.ts) and the rule checker read it. It is hand-kept (nothing regenerates it) and
# tests/fixture/manifest.test.ts holds it to the fixture; the live test holds database entries to the
# running database. Fields: id (the marker id), area (a feature area), kind (tie or control), description,
# location (database objects, or file and symbol), sources (accepted hosts, with the date read),
# expected_rules (rule ids, filled as rules arrive), pending, and for database entries the oracle mode.
# An entry whose oracle mode is load-fails also lists fails_on: the platform schema and role names its own
# failure must name. fails_on is an optional field added within manifest_version 1: no other mode carries
# it, and the offline test requires it on every load-fails entry.
manifest_version: 1
entries:
  - id: db.cellars-auth-uid-default
    area: auth
    kind: tie
    description: "Column default on cellars.created_by calls auth.uid(); the column references auth.users"
    location:
      database:
        - { object: column-default, schema: public, table: cellars, name: created_by }
        - { object: constraint, schema: public, table: cellars, name: cellars_created_by_fkey }
    sources:
      - { url: "https://github.com/supabase/auth/blob/0725a1d90cd9fbbb2a26f3baf18afd400a436f66/migrations/20220224000811_update_auth_functions.up.sql", read: 2026-11-26 }
      - { url: "https://github.com/supabase/supabase/blob/49525599d17c04d4fa8e9e0fb64e89b0b53e9344/apps/docs/content/guides/database/postgres/row-level-security.mdx", read: 2026-11-26 }
    note: "Unverified: the cited pages show auth.uid() only in policies and in its definition, not as a column default."
    expected_rules: []
    pending: false
    oracle: { mode: load-fails, fails_on: [auth] }
